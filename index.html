<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#820AD1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meu Bolso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--p:#820AD1;--p2:#5B0A99;--p3:#A63FEA;--bg:#F4F3F6;--card:#FFFFFF;--tx:#1B1720;--mut:#6D6678;--line:#E9E5EE;--pos:#0B8F5E;--neg:#D92D4A;--warn:#B76E00;--chipL:#F1E7FA;--chipD:#2A1B3B;--chip:var(--chipL);--plight:#D9B3FF;--ai1L:#F6ECFF;--ai2L:#EDE0FA;--aibL:#DCC3F3;--ai1D:#2A1B3B;--ai2D:#20122E;--aibD:#3B2A4F;--ai1:var(--ai1L);--ai2:var(--ai2L);--aib:var(--aibL);--bal1:#8F1FE0;--bal2:#560A93;--prgb:130,10,209;--sh:0 1px 2px rgba(30,0,60,.06),0 8px 24px rgba(70,0,120,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0A13;--card:#1A1421;--tx:#F3EEF8;--mut:#A99FB6;--line:#2B2335;--chip:var(--chipD);--ai1:var(--ai1D);--ai2:var(--ai2D);--aib:var(--aibD);--pos:#3DDC97;--neg:#FF7088;--warn:#F5B84B;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0A13;--card:#1A1421;--tx:#F3EEF8;--mut:#A99FB6;--line:#2B2335;--chip:var(--chipD);--ai1:var(--ai1D);--ai2:var(--ai2D);--aib:var(--aibD);--pos:#3DDC97;--neg:#FF7088;--warn:#F5B84B;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx)}
h1,h2,h3{margin:0}
#app{max-width:640px;margin:0 auto;min-height:100vh}
.hd{background:linear-gradient(180deg,var(--p) 0%,var(--p2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 70px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.2px}
.hsub{font-size:13px;opacity:.85}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:4px;background:rgba(255,255,255,.14);border-radius:16px;padding:4px}
.mnav .ib{width:42px;height:40px;border-radius:12px;color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}
.mnav .ib:active{background:rgba(255,255,255,.2)}
.mlabel{flex:1;text-align:center;font-weight:700;font-size:16px}
.mnow{display:block;margin:8px auto 0;font-size:12px;background:rgba(255,255,255,.18);color:#fff;padding:4px 12px;border-radius:99px}
.pill{display:flex;gap:8px;align-items:center;margin-top:12px;background:#fff;color:#5a3a00;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;width:100%;text-align:left}
.pill.red{color:#a4132d}
.body{padding:0 14px}
.pull{margin-top:-52px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{font-size:12px;color:var(--mut)}
.v{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
.v.sm{font-size:16px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.sav{color:var(--p)}.mut{color:var(--mut)}
@media (prefers-color-scheme:dark){.sav{color:var(--plight)}}
.cardbtn{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px}
.chev{font-size:24px;color:var(--mut)}
.balance{background:linear-gradient(135deg,var(--bal1),var(--bal2));color:#fff}
.balance .k{color:rgba(255,255,255,.8)}
.balance .v{font-size:30px}
.balance .sub{font-size:12px;opacity:.85;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--chip);color:var(--p)}
@media (prefers-color-scheme:dark){.btn{color:var(--plight)}}
.btn.primary{background:var(--p);color:#fff}
.btn.big{width:100%;padding:16px;font-size:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(var(--prgb),.3)}
.btn.danger{background:#FCE4E8;color:#B3132F}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5}
.btn.block{width:100%}
.sech{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
.sech h2{font-size:17px;font-weight:800}
.fbtn{position:relative;display:flex;gap:6px;align-items:center;background:var(--card);box-shadow:var(--sh);padding:8px 14px;border-radius:99px;font-weight:700;color:var(--p);font-size:14px}
.badge{position:absolute;top:-5px;right:-3px;background:var(--neg);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.list{background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it:active{background:var(--chip)}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--chip);flex:none}
.it .m{flex:1;min-width:0}
.it .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .a{font-weight:800;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--chip);color:var(--p);padding:1px 7px;border-radius:99px;margin-left:4px}
@media (prefers-color-scheme:dark){.tag{color:var(--plight)}}
.tag.g{background:#DDF5EA;color:#0B6B47}.tag.r{background:#FCE4E8;color:#B3132F}
.empty{padding:28px 18px;text-align:center;color:var(--mut)}
.endpad{height:calc(110px + 34vh + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{display:flex;width:100%;max-width:640px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--mut)}
#nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--p)}
@media (prefers-color-scheme:dark){#nav button.on{color:var(--plight)}}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:20px;background:var(--p);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 24px rgba(var(--prgb),.45)}
.ovl{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .18s ease-out}
.ovl.sheetbg{background:rgba(20,8,32,.55);display:flex;align-items:flex-end;justify-content:center}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ovl{animation:none}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;background:var(--bg)}
.sheet .sh-h h2{font-size:19px;font-weight:800}
.sheet .sh-b{overflow-y:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.sheet .sh-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);border-top:1px solid var(--line)}
.sheet .sh-f .btn{flex:1}
.xb{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:20px;display:grid;place-items:center}
.fld{margin:12px 0}
.fld>label,.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:6px}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(var(--prgb),.15)}
.inp.money{font-size:26px;font-weight:800;letter-spacing:-.4px}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 8px;border-radius:11px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--p);color:#fff}
.seg button.on.g{background:var(--pos)}.seg button.on.r{background:var(--neg)}
.swr{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 0;width:100%;text-align:left}
.swr b{display:block}.swr small{color:var(--mut)}
.sw{width:46px;height:28px;border-radius:99px;background:#CFC8D6;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--p)}.sw.on::after{transform:translateX(18px)}
.sub-box{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:4px 14px 12px;margin-top:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.err{color:var(--neg);font-weight:700;font-size:13px;padding:0 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{padding:8px 13px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;color:var(--mut)}
.chp.on{background:var(--p);border-color:var(--p);color:#fff}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(20,8,32,.6);display:grid;place-items:center;padding:24px}
.dlg .box{background:var(--card);border-radius:22px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.dlg h3{font-size:18px;margin-bottom:8px}
.dlg p{color:var(--mut);margin:0 0 16px;white-space:pre-line}
.dlg .btns{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#241432;color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.scr-h{background:linear-gradient(180deg,var(--p),var(--p2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 62px}
.scr-h .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.scr-h .top h2{font-size:18px;font-weight:800}
.scr-h .xb{background:rgba(255,255,255,.16);color:#fff}
.tbl-w{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
table.tb{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.tb th,.tb td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tb th{background:var(--chip);color:var(--p);font-weight:800;font-size:12px}
@media (prefers-color-scheme:dark){.tb th{color:var(--plight)}}
.tb th:first-child,.tb td:first-child{text-align:left;position:sticky;left:0;background:var(--card);border-right:1px solid var(--line);z-index:1;font-weight:700}
.tb th:first-child{background:var(--chip)}
.tb tr.tot td{font-weight:800;background:var(--chip)}
.tb tr.tot td:first-child{background:var(--chip)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.svgt{fill:var(--mut);font-size:10.5px;font-family:inherit}
.svgt.b{fill:var(--tx);font-weight:700}
.axis{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg-row:last-child{border:0}
.leg-row i{width:12px;height:12px;border-radius:4px;flex:none}
.leg-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alertbox{border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.alertbox.up{background:#FCE4E8;color:#8A1027}.alertbox.down{background:#DDF5EA;color:#0A5C3D}.alertbox.flat{background:var(--chip);color:var(--tx)}
.alertbox b{display:block;font-size:15px}
.alertbox .em{font-size:24px;line-height:1.1}
.alertbox .x{font-size:13px;opacity:.9;margin-top:2px}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--pos);border-radius:99px}
.ai{background:linear-gradient(135deg,var(--ai1),var(--ai2));color:#2A0F45;border:1px solid var(--aib)}
@media (prefers-color-scheme:dark){.ai{color:#F3EEF8}}
.ai h2{color:var(--p)!important;display:flex;align-items:center;gap:6px}
@media (prefers-color-scheme:dark){.ai h2{color:var(--plight)!important}}
.tip{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(var(--prgb),.15)}
.tip:last-of-type{border-bottom:0}
.tip .e{font-size:22px}
.tip b{display:block}
.tip span{font-size:13.5px;opacity:.9}
.aitxt{white-space:pre-wrap;font-size:14px;margin-top:10px}
.fx{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.fx:last-child{border:0}
.fx .m{flex:1;min-width:0;text-align:left}
.fx .t{font-weight:700}.fx .s{font-size:12.5px;color:var(--mut)}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.chk.on{background:var(--pos);border-color:var(--pos)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.opt h3{font-size:16px;margin-bottom:4px}
.opt p{margin:0 0 12px;color:var(--mut);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pageh{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.pageh h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
#bkbar{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:35;max-width:620px;margin:0 auto}
#bkbar .pill{margin:0;box-shadow:0 8px 24px rgba(0,0,0,.25);color:#3b0764}

.swatch{display:flex;align-items:center;gap:9px;padding:8px 15px 8px 8px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700}
.swatch i{width:28px;height:28px;border-radius:50%;display:block}
.swatch.on{border-color:var(--p);box-shadow:0 0 0 3px rgba(var(--prgb),.18)}
.catrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border:0}
.catrow .m{flex:1;min-width:0}
.catrow .t{font-weight:700}
.catrow .s{font-size:12.5px;color:var(--mut)}
.tb thead th{white-space:normal;line-height:1.2;vertical-align:bottom;min-width:96px}
.tb thead th:first-child{min-width:0}

</style>
</head>

/* cascata (waterfall): steps=[{l,v,t:'total'|'delta'}] */
function waterfallSvg(steps){
 if(!steps.length)return '';
 const bw=46,gap=14,padL=10,padR=10,H=250,top=26,bot=44;
 const W=Math.max(320,padL+padR+steps.length*(bw+gap));
 let cum=0;const bars=[];
 for(const s of steps){
  if(s.t==='total'){bars.push({s,y0:0,y1:s.v});cum=s.v}
  else{bars.push({s,y0:cum,y1:cum+s.v});cum+=s.v}
 }
 const vals=bars.flatMap(b=>[b.y0,b.y1]).concat([0]);
 let mx=Math.max(...vals),mn=Math.min(...vals);if(mx===mn)mx=mn+100;
 const sc=v=>top+(mx-v)/(mx-mn)*(H-top-bot);
 let g='';
 g+=`<line class="axis" x1="0" x2="${W}" y1="${sc(0)}" y2="${sc(0)}"/>`;
 bars.forEach((b,i)=>{
  const x=padL+i*(bw+gap),ya=sc(b.y0),yb=sc(b.y1),y=Math.min(ya,yb),h=Math.max(2,Math.abs(ya-yb));
  const col=b.s.t==='total'?THEME.p:(b.s.v>=0?'#0FA36B':'#E5334B');
  g+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="6" fill="${col}"/>`;
  if(i<bars.length-1){const nx=padL+(i+1)*(bw+gap);g+=`<line x1="${x+bw}" x2="${nx}" y1="${sc(b.y1).toFixed(1)}" y2="${sc(b.y1).toFixed(1)}" style="stroke:var(--mut)" stroke-dasharray="3 3" stroke-width="1"/>`}
  const lab=(b.s.t==='delta'&&b.s.v>0?'+':'')+fmtI(b.s.v);
  const ly=b.s.v>=0||b.s.t==='total'?y-6:y+h+13;
  g+=`<text x="${x+bw/2}" y="${ly.toFixed(1)}" text-anchor="middle" class="svgt b" style="font-size:10px">${lab}</text>`;
  g+=`<text x="${x+bw/2}" y="${H-24}" text-anchor="middle" class="svgt">${esc(b.s.l)}</text>`;
  if(b.s.l2)g+=`<text x="${x+bw/2}" y="${H-11}" text-anchor="middle" class="svgt" style="font-size:9.5px">${esc(b.s.l2)}</text>`;
 });
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico cascata da poupança">${g}</svg></div>`;
}

 }

function insights(ym){

 const top=Object.entries(ct).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({id,v,c:CATBY[id]||CATBY.outros_desp}));
 // média dos 3 meses anteriores (somente meses com gasto)
 const base={};let nm=0;
 for(let i=1;i<=3;i++){const m=ymAdd(ym,-i);if(spendOf(m)>0){nm++;const t=catTotals(m);for(const k in t)base[k]=(base[k]||0)+t[k]}}
 if(nm)for(const k in base)base[k]/=nm;

  else if(b&&t.v>b*1.2&&t.v-b>2000){cut=Math.round(t.v-b);why='Bem acima da sua média recente.'}

 }
 tips.sort((a,b)=>b.cut-a.cut);
 const goal=D.cfg.goal||0,limit=inc&&goal?Math.round(inc*goal/100):0;
 return{base,ym,prev,day,isCur,spend,pSpend,pct:pSpend?(spend-pSpend)/pSpend*100:null,cur,pcur,dpct:pcur?(cur-pcur)/pcur*100:null,inc,top,tips:tips.slice(0,4),goal,limit,over:limit?spend-limit:0,ct};
}
/* simulação da poupança */
function savYear(year){
 const y=String(year),banks={},months={};let opening=0;
 for(const t of D.tx){
  if(!t.sav)continue;const amt=t.mov==='credito'?t.v:-t.v,ty=t.date.slice(0,4);
  if(ty>y)continue;
  const b=t.bank||'Outro banco';banks[b]=banks[b]||{prior:0,m:{},total:0};
  if(ty<y){banks[b].prior+=amt;opening+=amt}
  else{const m=t.date.slice(0,7);banks[b].m[m]=(banks[b].m[m]||0)+amt;months[m]=(months[m]||0)+amt}
 }
 const ms=Object.keys(months).sort();
 for(const b in banks){banks[b].total=banks[b].prior+Object.values(banks[b].m).reduce((a,c)=>a+c,0)}
 const list=Object.entries(banks).filter(([,o])=>o.prior!==0||Object.keys(o.m).length).sort((a,b)=>b[1].total-a[1].total);
 return{opening,months:ms,mtot:months,banks:list,end:opening+ms.reduce((a,m)=>a+months[m],0)};
}
function simulate(year,rate,futureDep){
 const sy=savYear(year),cur=todayStr(),curYM=cur.slice(0,7);let bal=sy.opening,interest=0,dep=0;const series=[];
 for(let m=1;m<=12;m++){
  const ym=`${year}-${pad(m)}`,actual=ym<=curYM;
  const flow=actual?(sy.mtot[ym]||0):futureDep;
  const it=Math.round(Math.max(bal,0)*rate/100);
  bal+=it+flow;interest+=it;if(flow>0)dep+=flow;
  series.push({ym,flow,bal,actual});
 }
 return{opening:sy.opening,series,end:bal,interest,dep};
}
function avgDeposit(year){
 const sy=savYear(year),v=sy.months.map(m=>sy.mtot[m]).filter(x=>x>0);
 return v.length?Math.round(v.reduce((a,c)=>a+c,0)/v.length):0;
}

 const d=document.createElement('div');d.className='ovl '+(cls||'');d.id='ov-'+name;d.innerHTML=html;document.body.appendChild(d);

/* ================= lançamentos: lista e filtros ================= */
function applyFilter(list){
 const f=S.f;let l=list.slice();
 if(f.q){const q=f.q.toLowerCase();l=l.filter(t=>(t.desc||'').toLowerCase().includes(q)||(t.bank||'').toLowerCase().includes(q))}
 if(f.kind==='receita')l=l.filter(t=>!t.sav&&t.kind==='receita');
 if(f.kind==='conta')l=l.filter(t=>!t.sav&&t.kind==='conta');
 if(f.kind==='card')l=l.filter(t=>t.card);
 if(f.kind==='poup')l=l.filter(t=>t.sav);
 if(f.cat)l=l.filter(t=>t.cat===f.cat);
 const nm=t=>(t.desc||catOf(t).name);
 const s=f.sort;
 l.sort((a,b)=>s==='date_asc'?a.date.localeCompare(b.date)||a.id.localeCompare(b.id):s==='name_asc'?nm(a).localeCompare(nm(b),'pt-BR'):s==='name_desc'?nm(b).localeCompare(nm(a),'pt-BR'):b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 return l;
}
const nFilters=()=>(S.f.q?1:0)+(S.f.kind!=='all'?1:0)+(S.f.cat?1:0)+(S.f.sort!=='date_desc'?1:0);

 else{cls=t.kind==='receita'?'pos':'neg';sign=t.kind==='receita'?'+':'−'}

 return `<div class="list">${sh.map(itemHtml).join('')}</div>`;
}

/* ================= avisos de contas fixas ================= */
function dueSoon(){
 const today=todayStr(),cur=today.slice(0,7),out={late:0,soon:0};
 for(const b of billsFor(cur)){if(isPaid(b,cur))continue;const d=dateInYM(cur,b.day);if(d<today)out.late++;else if(d<=addDays(today,3))out.soon++}
 return out;
}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dueBanner(){
 const d=dueSoon();if(!d.late&&!d.soon)return '';
 const msg=d.late?`${d.late} conta${d.late>1?'s':''} fixa${d.late>1?'s':''} em atraso${d.soon?` e ${d.soon} vencendo em breve`:''}`:`${d.soon} conta${d.soon>1?'s':''} fixa${d.soon>1?'s':''} vencendo nos próximos 3 dias`;
 return `<button class="pill ${d.late?'red':''}" data-a="tab" data-t="fix"><span>🔔</span><span>${msg}</span></button>`;
}

let F=null;

 if(t.card){const g=D.tx.filter(x=>x.grp===t.grp);d.card=true;d.grp=t.grp;d.N=g.length;d.v=g.reduce((s,x)=>s+x.v,0);d.start=g.map(x=>x.date.slice(0,7)).sort()[0];d.startTouched=true}

}

 if(!f.v||f.v<=0)f.err='Informe um valor maior que zero.';

 if(f.err){renderForm();const b=$('#ov-form .sh-b');if(b)b.scrollTop=b.scrollHeight;return}
 const base={desc:f.desc.trim(),date:f.date};

 if(f.sav)list=[{id:f.id||uid(),kind:'poup',sav:true,mov:f.mov,bank:f.bank,v:f.v,...base,desc:f.desc.trim()}];

 else{
  const g=f.grp||uid(),N=f.N,b=Math.floor(f.v/N),rem=f.v-b*N;

 }

}

<section class="card ai"><h2>✨ Simulador de crescimento</h2>
 <div class="simgrid"><div class="fld" style="margin:0"><label for="s_r">Rendimento mensal (%)</label><input id="s_r" class="inp" inputmode="decimal" data-f="yield" value="${String(rate).replace('.',',')}"></div>
 <div class="fld" style="margin:0"><label for="s_d">Depósito mensal previsto</label><input id="s_d" class="inp" data-f="simdep" data-mask="money" inputmode="numeric" value="${S.simDep?fmtN(S.simDep):''}" placeholder="0,00"></div></div>
 <div class="hint">A poupança rende 0,5% ao mês mais a TR quando a Selic está acima de 8,5% ao ano; ajuste o percentual conforme o seu banco. O depósito previsto começa com a média dos seus meses com depósito.</div>
 <div class="grid2" style="margin-top:14px"><div><div class="k">Saldo projetado em dezembro</div><div class="v sav">${fmt(sim.end)}</div></div><div><div class="k">Rendimento estimado no ano</div><div class="v sm pos">${fmt(sim.interest)}</div></div></div>

 ${S.cap.sample?`<button class="btn sm" style="margin-top:12px" data-a="simai">Analisar com Claude</button><div id="simai" class="aitxt"></div>`:''}
</section><div class="endpad"></div></div>`;
}

const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function saveFile(name,data,mime,opt={}){
 const blob=data instanceof Blob?data:new Blob([data],{type:mime});
 if(NATIVE&&PL('Filesystem')&&PL('Share')){
  try{const w=await PL('Filesystem').writeFile({path:name,data:await blobB64(blob),directory:'CACHE'});
   await PL('Share').share({title:name,files:[w.uri],dialogTitle:'Salvar ou enviar arquivo'});return 'ok'}
  catch(e){return e&&/cancel/i.test(String(e.message||e))?'declined':'error'}
 }
 if(S.cap.dl){try{await S.cap.dl.save({filename:name,data:blob});return 'ok'}catch(e){if(e&&e.code==='declined')return 'declined'}}
 if(opt.share&&navigator.canShare){try{const file=new File([blob],name,{type:mime});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'ok'}}catch(e){if(e&&e.name==='AbortError')return 'declined'}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'ok'}catch(e){return 'error'}
}
const exportObj=()=>({app:'meubolso',version:1,exportedAt:new Date().toISOString(),tx:D.tx,fixed:D.fixed,cfg:{goal:D.cfg.goal,yield:D.cfg.yield,theme:D.cfg.theme,cats:D.cfg.cats||[],removed:D.cfg.removed||[]}});
const backupName=()=>{const d=new Date();return `meubolso-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`};

function saveSnap(){

 S.snaps.unshift({ts:now,json:JSON.stringify(exportObj()),n:D.tx.length,f:D.fixed.length});S.snaps=S.snaps.slice(0,7);
 DB.set('snaps',S.snaps);D.cfg.backup.lastSnap=now;

async function writeFolder(gesture){
 try{
  const h=await DB.get('dirHandle');if(!h)return false;
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted'){if(!gesture)return false;p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return false}
  const fh=await h.getFileHandle(backupName(),{create:true}),w=await fh.createWritable();
  await w.write(JSON.stringify(exportObj()));await w.close();return true;
 }catch(e){return false}
}
async function externalBackup(gesture){
 const bk=D.cfg.backup;let ok=false;
 if(bk.dest==='folder')ok=await writeFolder(gesture);
 else if(bk.dest==='file'){const r=await saveFile(backupName(),JSON.stringify(exportObj()),'application/json',{share:true});ok=r==='ok'}
 if(ok){bk.lastExt=Date.now();bk.pending=false}
 return ok;
}

 saveSnap();const bk=D.cfg.backup;

const notifState=()=>NATIVE?(S.nperm||'default'):(('Notification' in window)?Notification.permission:'unsupported');
const nid=k=>{let h=7;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))|0;return Math.abs(h)%2147483000+1};
async function refreshNative(){

async function syncNative(){
 const ln=PL('LocalNotifications');if(!ln||S.nperm!=='granted')return;
 try{
  await ln.createChannel({id:'contas',name:'Contas a pagar',description:'Alertas de vencimento das contas fixas',importance:5,visibility:1,vibration:true});
  const pend=await ln.getPending();
  if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const now=Date.now(),cur=todayStr().slice(0,7),list=[];
  for(const b of D.fixed){
   if(!b.alert)continue;
   for(let i=-1;i<14;i++){
    const ym=ymAdd(cur,i);if(!activeIn(b,ym)||isPaid(b,ym))continue;
    const at=alertAt(b,ym);if(at.getTime()<=now)continue;
    list.push({id:nid(`${b.id}:${ym}`),title:'Conta a pagar: '+b.desc,body:`${fmt(b.v)} · vence ${fmtDate(dateInYM(ym,b.day))}`,channelId:'contas',schedule:{at,allowWhileIdle:true}});
   }
  }
  list.sort((a,b)=>a.schedule.at-b.schedule.at);
  if(list.length)await ln.schedule({notifications:list.slice(0,60)});
 }catch(e){}
}

  try{const r=await ln.requestPermissions();S.nperm=r.display==='granted'?'granted':r.display==='denied'?'denied':'default'}catch(e){}
  toast(S.nperm==='granted'?'Notificações ativadas':'Notificações não permitidas');

async function notify(title,body,tag){
 if(NATIVE){
  try{const ln=PL('LocalNotifications');if(!ln||S.nperm!=='granted')return false;
   await ln.createChannel({id:'contas',name:'Contas a pagar',description:'Alertas de vencimento das contas fixas',importance:5,visibility:1,vibration:true});
   await ln.schedule({notifications:[{id:nid(tag+Date.now()),title,body,channelId:'contas',schedule:{at:new Date(Date.now()+1500),allowWhileIdle:true}}]});return true}catch(e){return false}
 }
 try{
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  const reg=S.swReg||(navigator.serviceWorker&&navigator.serviceWorker.getRegistration?await navigator.serviceWorker.getRegistration():null);
  if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',vibrate:[80,40,80],data:{url:'./'}});return true}
  new Notification(title,{body,tag});return true;

function checkAlerts(){
 if(NATIVE)return;
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const now=new Date(),cur=todayStr().slice(0,7),seen=new Set(D.cfg.notified||[]);let changed=false;
 for(const b of D.fixed){
  if(!b.alert)continue;
  for(const ym of [ymAdd(cur,-1),cur,ymAdd(cur,1)]){
   if(!activeIn(b,ym)||isPaid(b,ym))continue;
   const at=alertAt(b,ym),key=`${b.id}:${ym}`;
   if(at<=now&&now-at<48*3600e3&&!seen.has(key)){seen.add(key);changed=true;notify('Conta a pagar: '+b.desc,`${fmt(b.v)} · vence ${fmtDate(dateInYM(ym,b.day))}`,key)}
  }
 }
 if(changed){D.cfg.notified=[...seen].slice(-200);persist()}
}
async function scheduleTriggers(){
 try{
  if(NATIVE)return;
  if(!('Notification' in window)||!('showTrigger' in Notification.prototype)||typeof TimestampTrigger==='undefined'||Notification.permission!=='granted')return;
  const reg=S.swReg||await navigator.serviceWorker.ready,now=Date.now(),cur=todayStr().slice(0,7);
  (await reg.getNotifications({includeTriggered:false})).forEach(n=>n.close());
  for(const b of D.fixed){
   if(!b.alert)continue;
   for(let i=0;i<3;i++){const ym=ymAdd(cur,i);if(!activeIn(b,ym)||isPaid(b,ym))continue;const at=alertAt(b,ym).getTime();
    if(at>now)await reg.showNotification('Conta a pagar: '+b.desc,{tag:`${b.id}:${ym}`,body:`${fmt(b.v)} · vence ${fmtDate(dateInYM(ym,b.day))}`,icon:'icon-192.png',showTrigger:new TimestampTrigger(at)})}
  }
 }catch(e){}
}
const icsD=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsE=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsText(bills){
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meu Bolso//PT-BR','CALSCALE:GREGORIAN'],stamp=icsD(new Date())+'',cur=todayStr().slice(0,7);
 for(const b of bills)for(let i=0;i<12;i++){
  const ym=ymAdd(cur,i);if(!activeIn(b,ym)||isPaid(b,ym))continue;
  const due=dateInYM(ym,b.day),st=b.alert?alertAt(b,ym):new Date(due+'T09:00:00'),en=new Date(st.getTime()+30*60000);
  L.push('BEGIN:VEVENT',`UID:${b.id}-${ym}@meubolso`,`DTSTAMP:${stamp}`,`DTSTART:${icsD(st)}`,`DTEND:${icsD(en)}`,`SUMMARY:${icsE('Pagar '+b.desc+' - '+fmt(b.v))}`,`DESCRIPTION:${icsE('Vence em '+fmtDateFull(due))}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Conta a pagar','TRIGGER:PT0M','END:VALARM','END:VEVENT');
 }
 L.push('END:VCALENDAR');return L.join('\r\n');
}

/* ================= relatório em PDF ================= */
function wf(x,steps,X0,Y0,X1,Y1){
 if(!steps.length)return;let cum=0;const bars=steps.map(s=>{if(s.t==='total'){cum=s.v;return{s,a:0,b:s.v}}const o={s,a:cum,b:cum+s.v};cum+=s.v;return o});
 const vals=bars.flatMap(b=>[b.a,b.b]).concat([0]);let mx=Math.max(...vals),mn=Math.min(...vals);if(mx===mn)mx=mn+100;

function buildPDF(canvases){

 obj(1,()=>str('<< /Type /Catalog /Pages 2 0 R >>\n'));
 obj(2,()=>str(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>\n`));
 canvases.forEach((c,i)=>{
  const pg=3+3*i,ct=pg+1,im=pg+2,jpg=b64(c.toDataURL('image/jpeg',0.9)),cs=`q 595 0 0 842 0 0 cm /Im0 Do Q`;

  obj(ct,()=>{str(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\n`)});
  obj(im,()=>{str(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);str('\nendstream\n')});
 });

}

  case 'x_date':FX.date=el.value;if(!FX.edit&&isValidDate(FX.date))FX.start=ymOf(FX.date);renderFX();break;
  case 'x_cat':FX.cat=el.value;break;
  case 'x_before':FX.before=+el.value;break;
  case 'x_time':FX.time=el.value;break;
  case 'yield':{const v=parseFloat(String(el.value).replace(',','.'));D.cfg.yield=Number.isFinite(v)?Math.min(20,Math.max(0,v)):0.5;persist();render();break}
  case 'simdep':S.simDep=+el.dataset.c||0;render();break;
  case 'goal':{const v=parseInt(el.value,10);D.cfg.goal=Number.isFinite(v)?Math.min(200,Math.max(1,v)):80;persist();render();break}
  case 'bkEvery':D.cfg.backup.every=+el.value;persist();render();autoBackupTick();break;
  case 'bkDest':D.cfg.backup.dest=el.value;persist();render();break;
 }
});

/* ================= inicialização ================= */
async function initCaps(){
 if(!(window.claude&&window.claude.use))return;
 const g=n=>window.claude.use(n).catch(()=>null);
 const [dl,sm]=await Promise.all([g('downloads'),g('sample')]);
 S.cap.dl=dl||null;S.cap.sample=sm||null;if(!S.ov.length)render();
}
function registerSW(){
 if(NATIVE||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol)||window.top!==window.self)return;
 navigator.serviceWorker.register('sw.js').then(r=>{S.swReg=r}).catch(()=>{});
}
async function boot(){
 const ok=await DB.open();
 const [tx,fixed,cfg,snaps]=await Promise.all([DB.get('tx'),DB.get('fixed'),DB.get('cfg'),DB.get('snaps')]);
 D.tx=Array.isArray(tx)?tx:[];D.fixed=Array.isArray(fixed)?fixed:[];
 D.cfg={...CFG0(),...(cfg||{})};D.cfg.backup={...CFG0().backup,...((cfg&&cfg.backup)||{})};if(!Array.isArray(D.cfg.notified))D.cfg.notified=[];if(!Array.isArray(D.cfg.cats))D.cfg.cats=[];if(!Array.isArray(D.cfg.removed))D.cfg.removed=[];
 rebuildCats();applyTheme(D.cfg.theme);try{localStorage.setItem('mb_theme',THEME.name)}catch(e){}
 S.snaps=Array.isArray(snaps)?snaps:[];
 S.dirOK=typeof window.showDirectoryPicker==='function'&&window.top===window.self;
 render();registerSW();initCaps();
 if(NATIVE){const sb=PL('SystemBars');if(sb)sb.setStyle({style:'DARK',bar:'StatusBar'}).catch(()=>{});refreshNative().then(syncNative);document.addEventListener('resume',()=>refreshNative().then(syncNative))}
 if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(p=>{S.persisted=p;if(S.tab==='opt'&&!S.ov.length)render()}).catch(()=>{})}
 S.dirOK=S.dirOK&&!NATIVE;
 if(!ok)setTimeout(()=>toast('Armazenamento local indisponível: os dados valem só até fechar o app'),800);
 checkAlerts();autoBackupTick();showBkBar();scheduleTriggers();
 setInterval(()=>{checkAlerts();autoBackupTick()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlerts();autoBackupTick()}});
}
try{applyTheme(localStorage.getItem('mb_theme')||'roxo')}catch(e){applyTheme('roxo')}
rebuildCats();
boot();


</script>
